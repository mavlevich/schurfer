gate-identity-candidate-tooling = "schurfer_analytics.gate_identity_candidate_tooling:main"
source-lead-identity-evidence = "schurfer_analytics.source_lead_identity_evidence:main"
episode-replay = "schurfer_analytics.episode_replay:main"
virtual-strategy-report = "schurfer_analytics.virtual_strategy_report:main"
virtual-entry-challenger-report = "schurfer_analytics.virtual_entry_challenger_report:main"
virtual-threshold-challenger-report = "schurfer_analytics.virtual_threshold_challenger_report:main"
virtual-exit-policy-report = "schurfer_analytics.virtual_exit_policy_report:main"
virtual-exit-discovery-report = "schurfer_analytics.virtual_exit_discovery_report:main"
virtual-score-challenger-report = "schurfer_analytics.virtual_score_challenger_report:main"
virtual-banded-price-extent-report = "schurfer_analytics.virtual_banded_price_extent_report:main"
candle-anomaly-report = "schurfer_analytics.candle_anomaly_report:main"
derivatives-context-report = "schurfer_analytics.derivatives_context_report:main"
decision-quality-report = "schurfer_analytics.decision_quality_report:main"
derivatives-regime-feasibility-report = "schurfer_analytics.derivatives_regime_feasibility:main"
long-short-ratio-regime-report = "schurfer_analytics.long_short_ratio_regime_report:main"
