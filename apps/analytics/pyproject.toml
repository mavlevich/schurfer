[project]
name = "schurfer-analytics"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ccxt==4.5.68",
    "duckdb==1.5.5",
    "greenlet>=3.2",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    # Required by DuckDB's Python client to convert a TIMESTAMPTZ result
    # column back into a tz-aware Python datetime (see
    # momentum_flow_bidirectional_burst_offline_repository.py's own
    # _duckdb_connect docstring) -- not imported directly anywhere in this
    # package.
    "pytz>=2024.1",
    "redis>=5.2",
    "schurfer-journal",
    "schurfer-performance",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
]

[project.scripts]
pump-scanner = "schurfer_analytics.main:main"
outcome-resolver = "schurfer_analytics.outcome_worker:main"
momentum-flow-watch = "schurfer_analytics.momentum_flow_watch_worker:main"
research-dataset-artifact-validate = "schurfer_analytics.research_dataset_artifact:main"
momentum-flow-watch-binance = "schurfer_analytics.momentum_flow_watch_binance_worker:main"
momentum-flow-paper = "schurfer_analytics.momentum_flow_paper_worker:main"
momentum-flow-paper-binance = "schurfer_analytics.momentum_flow_paper_binance_worker:main"
momentum-flow-paper-lev3 = "schurfer_analytics.momentum_flow_paper_lev3_worker:main"
momentum-flow-paper-hold12h = "schurfer_analytics.momentum_flow_paper_hold12h_worker:main"
momentum-flow-episode-study-report = "schurfer_analytics.momentum_flow_episode_study_report:main"
momentum-flow-discovery-report = "schurfer_analytics.momentum_flow_discovery_report:main"
binance-watch-input-coverage-report = "schurfer_analytics.binance_watch_input_coverage_report:main"
bidirectional-burst-study-report = "schurfer_analytics.momentum_flow_bidirectional_burst_report:main"
cex-activity-discovery-report = "schurfer_analytics.cex_activity_discovery_report:main"
radar-outcome-discovery-report = "schurfer_analytics.radar_outcome_discovery_report:main"
measurement-report = "schurfer_analytics.measurement_report:main"
exchange-coverage-report = "schurfer_analytics.exchange_coverage_report:main"
