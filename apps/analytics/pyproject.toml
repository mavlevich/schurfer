cex-activity-path-coverage-audit-report = "schurfer_analytics.cex_activity_path_coverage_audit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["schurfer_analytics*"]

[tool.setuptools.package-data]
schurfer_analytics = [
    "registry/*.json",
    "evidence/source_lead/v2/*.json",
    "evidence/source_lead/v3/*.json",
]

[tool.uv]
package = true

[tool.uv.sources]
schurfer-journal = { workspace = true }
schurfer-performance = { workspace = true }
