[project]
name = "schurfer-execution"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ccxt==4.5.68",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.2",
    "structlog>=24.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "schurfer-performance",
    "schurfer-market-quality",
]

[project.scripts]
execution-service = "schurfer_execution.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["schurfer_execution*"]

[tool.uv]
package = true

[tool.uv.sources]
schurfer-performance = { workspace = true }
schurfer-market-quality = { workspace = true }
