# Pre-commit hooks for Schurfer
# Install: uv tool install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # --- General ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # --- Secrets ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Conventional commits ---
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, test, refactor, ci, perf, build]

  # --- Python ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies:
          - 'sqlalchemy[mypy]>=2.0'
          - 'alembic>=1.14'
          - 'psycopg[binary]>=3.2'
          - 'structlog>=24.4'
        args:
          - --ignore-missing-imports
          - packages/journal/schurfer_journal
        pass_filenames: false

  # --- Go ---
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-mod-tidy

  # golangci-lint uses language: system (official recommendation, see
  # https://golangci-lint.run/welcome/install/#pre-commit).
  # Required: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
  # Runs from the module dir because golangci-lint v2 cannot resolve ./...
  # from a directory that is not listed in go.work.
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: bash -c 'ROOT=$(git rev-parse --show-toplevel) && cd "$ROOT/apps/api-gateway" && golangci-lint run --config "$ROOT/.golangci.yml" ./...'
        pass_filenames: false
        types: [go]
        require_serial: true

  # --- TypeScript / JavaScript ---
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
