# Pre-commit hooks for Schurfer
# Install: make install (runs pre-commit install for all three hook types
# this repo uses: pre-commit, commit-msg, and pre-push -- a bare
# `pre-commit install` alone only wires up the pre-commit stage below and
# silently skips the commit-msg and make-verify pre-push hooks).
# Run manually: pre-commit run --all-files
# Run just the pre-push stage manually: pre-commit run --hook-stage pre-push --all-files

repos:
  # --- General ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # --- Secrets ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Conventional commits ---
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, test, refactor, ci, perf, build]

  # --- Python ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies:
          - 'sqlalchemy[mypy]>=2.0'
          - 'alembic>=1.14'
          - 'psycopg[binary]>=3.2'
          - 'structlog>=24.4'
        args:
          - --ignore-missing-imports
          - packages/journal/schurfer_journal
        pass_filenames: false

  # --- Go ---
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-mod-tidy

  # golangci-lint uses language: system (official recommendation, see
  # https://golangci-lint.run/welcome/install/#pre-commit).
  # `make install` installs the version pinned in the root Makefile.
  # Runs from the module dir because golangci-lint v2 cannot resolve ./...
  # from a directory that is not listed in go.work.
  - repo: local
    hooks:
      - id: ai-rules-check
        name: AI rules and repo-local skills
        language: system
        entry: python3 infra/scripts/check_ai_rules.py
        pass_filenames: false
        files: '(^AI_RULES\.md$|^AGENTS\.md$|^CLAUDE\.md$|^GEMINI\.md$|^\.cursor|^\.windsurf|^\.agents/skills/|^\.github/copilot-instructions\.md$|^infra/scripts/check_ai_rules\.py$)'
      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: bash -c 'ROOT=$(git rev-parse --show-toplevel) && LINT="$(go env GOPATH)/bin/golangci-lint" && grep "^use " "$ROOT/go.work" | awk "{print \$2}" | while read -r dir; do (cd "$ROOT/$dir" && "$LINT" run --config "$ROOT/.golangci.yml" ./...); done'
        pass_filenames: false
        types: [go]
        require_serial: true

  # --- TypeScript / JavaScript ---
  # Use the workspace-locked stable Prettier instead of a second formatter version.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: pnpm exec prettier --write
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]

  # --- Pre-push ---
  # ROADMAP tech debt: the per-commit hooks above are deliberately fast
  # (lint/format/unit-test-adjacent checks only) so they don't slow down
  # every commit -- make verify (full Python/Go test suites, mypy,
  # deadcode) is much slower and belongs at push time instead, so broken
  # code has one more gate before it reaches CI, not on every commit.
  # `make install` runs `pre-commit install --hook-type pre-push` so this
  # actually activates; pass_filenames: false and always_run: true since
  # make verify itself decides its own file scope, not pre-commit's diff.
  - repo: local
    hooks:
      - id: make-verify
        name: make verify (pre-push)
        language: system
        entry: make verify
        pass_filenames: false
        always_run: true
        stages: [pre-push]
