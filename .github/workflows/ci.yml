name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: SKIP=no-commit-to-branch pre-commit run --all-files

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --extra dev --all-packages
      - name: Check for tests
        id: check
        run: |
          if find apps packages -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No Python tests found, skipping"
          fi
      - name: Run tests with coverage
        if: steps.check.outputs.has_tests == 'true'
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: steps.check.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Check for Go modules
        id: check
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "No Go modules found, skipping"
          fi
      - name: Run tests
        if: steps.check.outputs.has_modules == 'true'
        run: |
          grep '^use ' go.work | awk '{print $2}' | while read -r dir; do
            echo "=== go test $dir ==="
            (cd "$dir" && go test -race -covermode=atomic ./...)
          done
      - name: Upload coverage
        if: steps.check.outputs.has_modules == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage.out

  test-ts:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install
      - name: Check for TS projects
        id: check
        run: |
          if find apps/web packages -name 'tsconfig.json' 2>/dev/null | grep -q .; then
            echo "has_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ts=false" >> "$GITHUB_OUTPUT"
            echo "No TypeScript projects found, skipping"
          fi
      - name: Type check
        if: steps.check.outputs.has_ts == 'true'
        run: pnpm -r run typecheck
      - name: Run tests
        if: steps.check.outputs.has_ts == 'true'
        run: pnpm -r run test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Python dependency audit
        run: |
          uv sync --extra dev --all-packages
          uv export --extra dev --no-emit-project --no-hashes | grep -v '^pip==' | uv run pip-audit -r /dev/stdin
      - name: Go vulnerability check
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
            grep '^use ' go.work | awk '{print $2}' | while read -r dir; do
              echo "=== govulncheck $dir ==="
              (cd "$dir" && govulncheck ./...)
            done
          else
            echo "No Go modules found, skipping"
          fi
      - name: Node dependency audit
        run: pnpm install && pnpm audit --audit-level=high
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret

  deadcode:
    name: Dead code detection
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Python dead code
        run: |
          if find apps packages -name '*.py' 2>/dev/null | grep -q .; then
            uv sync --extra dev --all-packages
            uv run vulture apps/ packages/ --min-confidence 90
          else
            echo "No Python code found, skipping"
          fi
      - name: Go dead code
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            go install golang.org/x/tools/cmd/deadcode@latest
            grep '^use ' go.work | awk '{print $2}' | while read -r dir; do
              echo "=== deadcode $dir ==="
              (cd "$dir" && deadcode ./...)
            done
          else
            echo "No Go modules found, skipping"
          fi
