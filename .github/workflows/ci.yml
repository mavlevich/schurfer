name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          # A glob, not an enumerated list: the enumerated form (api-gateway/
          # collector/notifier only) had silently drifted out of sync with
          # go.work, which also lists apps/market-hotset -- its own go.sum
          # was never part of this cache's key, so a change there could
          # reuse a stale Go module cache without anyone noticing. A glob
          # covers every apps/*/go.sum automatically, including any future
          # module, with no list to keep in sync by hand.
          cache-dependency-path: apps/*/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install golangci-lint
        run: make install-golangci-lint
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: make ci-lint

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: lint
    # A real Postgres, not just the _connect_or_skip-based tests silently
    # skipping: apps/analytics's own real-Postgres integration tests and
    # apps/execution's test_episodes_integration.py (episode claim/reclaim
    # concurrency, the live-instrument partial unique index,
    # open_trade_for_episode atomicity) need this to actually run rather
    # than pass by never executing. Mirrors the test-go job's service block.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: schurfer
          POSTGRES_PASSWORD: schurfer_dev
          POSTGRES_DB: schurfer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U schurfer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --frozen --extra dev --all-packages
      - name: Initialize test database schema
        run: PGPASSWORD=schurfer_dev psql -h localhost -U schurfer -d schurfer -f infra/docker/init-db.sql
      - name: Run Alembic migrations against the test database
        run: |
          cd packages/journal && \
            DATABASE_URL=postgresql://schurfer:schurfer_dev@localhost:5432/schurfer \
            uv run --package schurfer-journal alembic upgrade head
      - name: Check for tests
        id: check
        run: |
          if find apps packages -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No Python tests found, skipping"
          fi
      - name: Run tests with coverage
        if: steps.check.outputs.has_tests == 'true'
        # REQUIRE_INTEGRATION_DB=1 turns test_episodes_integration.py's and
        # test_early_momentum_scanner_quality_integration.py's own
        # _connect_or_skip into a hard failure (not a silent skip) when the
        # Postgres service above is unreachable -- a misconfigured/broken
        # service must fail this job loudly, not quietly pass with those
        # tests never actually having run (colleague review).
        run: uv run pytest --cov --cov-report=xml --cov-report=term
        env:
          REQUIRE_INTEGRATION_DB: '1'
      - name: Upload coverage
        if: steps.check.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: lint
    # A real Postgres, not just the stub-based tests: apps/collector's own
    # *_integration_test.go files and apps/api-gateway's own
    # momentum_watch_integration_test.go / combined_cte_integration_test.go
    # connect to exactly this (testDatabaseURL in each, matching
    # infra/docker/docker-compose.dev.yml's own dev credentials) rather than
    # skipping, so a genuine NULL-scan mismatch between a nullable SQL column
    # and a non-pointer Go destination field actually fails CI instead of
    # only surfacing in production (two such incidents on 2026-08-16 prompted
    # this: see combinedTradesCTE's and momentumWatchQuery's own doc
    # comments). Without this service those tests still run locally for
    # anyone with `make dev` up, but were previously always skipped here.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: schurfer
          POSTGRES_PASSWORD: schurfer_dev
          POSTGRES_DB: schurfer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U schurfer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          # A glob, not an enumerated list: the enumerated form (api-gateway/
          # collector/notifier only) had silently drifted out of sync with
          # go.work, which also lists apps/market-hotset -- its own go.sum
          # was never part of this cache's key, so a change there could
          # reuse a stale Go module cache without anyone noticing. A glob
          # covers every apps/*/go.sum automatically, including any future
          # module, with no list to keep in sync by hand.
          cache-dependency-path: apps/*/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Initialize test database schema
        run: PGPASSWORD=schurfer_dev psql -h localhost -U schurfer -d schurfer -f infra/docker/init-db.sql
      - name: Run Alembic migrations against the test database
        run: |
          uv sync --frozen --extra dev --all-packages
          cd packages/journal && \
            DATABASE_URL=postgresql://schurfer:schurfer_dev@localhost:5432/schurfer \
            uv run --package schurfer-journal alembic upgrade head
      - name: Check for Go modules
        id: check
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "No Go modules found, skipping"
          fi
      - name: Run tests
        if: steps.check.outputs.has_modules == 'true'
        run: |
          grep '^use ' go.work | awk '{print $2}' | while read -r dir; do
            echo "=== go test $dir ==="
            (cd "$dir" && go test -race -covermode=atomic ./...)
          done
      - name: Upload coverage
        if: steps.check.outputs.has_modules == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage.out

  test-ts:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check for TS projects
        id: check
        run: |
          if find apps/web packages -name 'tsconfig.json' 2>/dev/null | grep -q .; then
            echo "has_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ts=false" >> "$GITHUB_OUTPUT"
            echo "No TypeScript projects found, skipping"
          fi
      - name: Lint web
        if: steps.check.outputs.has_ts == 'true'
        run: pnpm --filter @schurfer/web lint
      - name: Type check web
        if: steps.check.outputs.has_ts == 'true'
        run: pnpm --filter @schurfer/web typecheck
      - name: Build web
        if: steps.check.outputs.has_ts == 'true'
        run: pnpm --filter @schurfer/web build
      - name: Run tests
        if: steps.check.outputs.has_ts == 'true'
        run: pnpm -r run test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          # A glob, not an enumerated list: the enumerated form (api-gateway/
          # collector/notifier only) had silently drifted out of sync with
          # go.work, which also lists apps/market-hotset -- its own go.sum
          # was never part of this cache's key, so a change there could
          # reuse a stale Go module cache without anyone noticing. A glob
          # covers every apps/*/go.sum automatically, including any future
          # module, with no list to keep in sync by hand.
          cache-dependency-path: apps/*/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Python dependency audit
        run: |
          uv sync --frozen --extra dev --all-packages
          uv export --extra dev --no-emit-project --no-hashes | grep -v '^pip==' | uv run pip-audit -r /dev/stdin
      - name: Go vulnerability check
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
            grep '^use ' go.work | awk '{print $2}' | while read -r dir; do
              echo "=== govulncheck $dir ==="
              (cd "$dir" && govulncheck ./...)
            done
          else
            echo "No Go modules found, skipping"
          fi
      - name: Node dependency audit
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level=high
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret

  deadcode:
    name: Dead code detection
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          # A glob, not an enumerated list: the enumerated form (api-gateway/
          # collector/notifier only) had silently drifted out of sync with
          # go.work, which also lists apps/market-hotset -- its own go.sum
          # was never part of this cache's key, so a change there could
          # reuse a stale Go module cache without anyone noticing. A glob
          # covers every apps/*/go.sum automatically, including any future
          # module, with no list to keep in sync by hand.
          cache-dependency-path: apps/*/go.sum
      - name: Python dead code
        run: |
          if find apps packages -name '*.py' 2>/dev/null | grep -q .; then
            uv sync --frozen --extra dev --all-packages
            uv run vulture apps/ packages/ --min-confidence 90
          else
            echo "No Python code found, skipping"
          fi
      - name: Go dead code
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            go install golang.org/x/tools/cmd/deadcode@v0.48.0
            grep '^use ' go.work | awk '{print $2}' | while read -r dir; do
              echo "=== deadcode $dir ==="
              (cd "$dir" && deadcode ./...)
            done
          else
            echo "No Go modules found, skipping"
          fi
