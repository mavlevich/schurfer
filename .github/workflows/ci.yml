name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: SKIP=no-commit-to-branch pre-commit run --all-files

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Check for tests
        id: check
        run: |
          if find apps packages -name 'test_*.py' -o -name '*_test.py' 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No Python tests found, skipping"
          fi
      - name: Run tests with coverage
        if: steps.check.outputs.has_tests == 'true'
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: steps.check.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml

  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Check for Go modules
        id: check
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
            echo "No Go modules found, skipping"
          fi
      - name: Run tests
        if: steps.check.outputs.has_modules == 'true'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        if: steps.check.outputs.has_modules == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go
          path: coverage.out

  test-ts:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install
      - name: Check for TS projects
        id: check
        run: |
          if find apps/web packages -name 'tsconfig.json' 2>/dev/null | grep -q .; then
            echo "has_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ts=false" >> "$GITHUB_OUTPUT"
            echo "No TypeScript projects found, skipping"
          fi
      - name: Type check
        if: steps.check.outputs.has_ts == 'true'
        run: pnpm -r run typecheck
      - name: Run tests
        if: steps.check.outputs.has_ts == 'true'
        run: pnpm -r run test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Python dependency audit
        run: uv sync --extra dev && uv run pip-audit
      - name: Go vulnerability check
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
            govulncheck ./...
          else
            echo "No Go modules found, skipping"
          fi
      - name: Node dependency audit
        run: pnpm install && pnpm audit --audit-level=high

  deadcode:
    name: Dead code detection
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Python dead code
        run: |
          if find apps packages -name '*.py' 2>/dev/null | grep -q .; then
            uv sync --extra dev
            uv run vulture apps/ packages/ --min-confidence 90
          else
            echo "No Python code found, skipping"
          fi
      - name: Go dead code
        run: |
          if find . -name 'go.mod' -not -path './vendor/*' 2>/dev/null | grep -q .; then
            go install golang.org/x/tools/cmd/deadcode@latest
            deadcode ./...
          else
            echo "No Go modules found, skipping"
          fi
