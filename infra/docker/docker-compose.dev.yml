services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: schurfer-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: schurfer
      POSTGRES_PASSWORD: schurfer_dev
      POSTGRES_DB: schurfer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schurfer']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: schurfer-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: schurfer-nats
    ports:
      - '4222:4222'
      - '8222:8222'
    command: --jetstream --store_dir /data --http_port 8222
    volumes:
      - nats_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ../../
      dockerfile: apps/api-gateway/Dockerfile
    container_name: schurfer-api-gateway
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://schurfer:schurfer_dev@postgres:5432/schurfer
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      PORT: '8000'
      ENV: development
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8000/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: ../../
      dockerfile: apps/collector/Dockerfile
    container_name: schurfer-collector
    environment:
      NATS_URL: nats://nats:4222
      BYBIT_SYMBOLS: ${BYBIT_SYMBOLS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build:
      context: ../../
      dockerfile: apps/analytics/Dockerfile
    container_name: schurfer-analytics
    environment:
      DATABASE_URL: postgresql://schurfer:schurfer_dev@postgres:5432/schurfer
      REDIS_ADDR: redis:6379
      PUMP_EXCHANGES: ${PUMP_EXCHANGES:-}
      PUMP_MIN_PCT: ${PUMP_MIN_PCT:-30}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
