services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: schurfer-postgres
    # Docker's 64MB default /dev/shm is too small once queries need real
    # working memory (parallel workers, hash joins) — Postgres fails with
    # "could not resize shared memory segment: No space left on device"
    # long before the host's own /dev/shm (sized off total RAM) is close to full.
    shm_size: '256m'
    environment:
      POSTGRES_USER: schurfer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: schurfer
    # Bound to the server's loopback only — reachable via SSH/Tailscale tunnel
    # (ssh -L 15432:127.0.0.1:5432 user@server), never from the public internet.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schurfer']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: schurfer-redis
    volumes:
      - redis_data:/data
    # noeviction: safety-critical keys (kill-switch, order locks, position state)
    # must never be silently evicted under memory pressure. If memory fills,
    # writes fail loudly instead of losing the kill-switch.
    # appendonly (AOF, fsync every second) makes the decision outbox stream durable
    # to ~1s of loss on a host crash; the RDB snapshot is kept as a second copy.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --save 60 1 --appendonly yes --appendfsync everysec
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  nats:
    image: nats:2-alpine
    container_name: schurfer-nats
    command: --jetstream --store_dir /data --http_port 8222
    volumes:
      - nats_data:/data
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api-gateway:
    build:
      context: ../../
      dockerfile: apps/api-gateway/Dockerfile
    container_name: schurfer-api-gateway
    environment:
      DATABASE_URL: postgresql://schurfer:${POSTGRES_PASSWORD}@postgres:5432/schurfer
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      PORT: '8000'
      ENV: production
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      EXECUTION_URL: http://execution:8001
      RUNTIME_METRICS_PATH: /runtime/container-metrics.snapshot
      RESEARCH_CHECKPOINTS_PATH: /runtime/research-checkpoints.json
    volumes:
      - ../../runtime:/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8000/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: schurfer-web
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    container_name: schurfer-caddy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:?Set TAILSCALE_HOSTNAME in .env.prod}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  collector:
    build:
      context: ../../
      dockerfile: apps/collector/Dockerfile
    container_name: schurfer-collector
    environment:
      NATS_URL: nats://nats:4222
      BYBIT_SYMBOLS: ${BYBIT_SYMBOLS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      nats:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  market-hotset:
    build:
      context: ../../
      dockerfile: apps/collector/Dockerfile
    container_name: schurfer-market-hotset
    entrypoint: ['/hotset']
    environment:
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      HOTSET_BUCKET_SECONDS: ${HOTSET_BUCKET_SECONDS:-5}
      HOTSET_PREBUFFER_SECONDS: ${HOTSET_PREBUFFER_SECONDS:-600}
      HOTSET_TTL_SECONDS: ${HOTSET_TTL_SECONDS:-14400}
      HOTSET_MAX_SYMBOLS: ${HOTSET_MAX_SYMBOLS:-12}
      HOTSET_STREAM_MAXLEN: ${HOTSET_STREAM_MAXLEN:-3600}
      HOTSET_STREAM_TTL_SECONDS: ${HOTSET_STREAM_TTL_SECONDS:-86400}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  orderflow-pilot:
    profiles: ['orderflow']
    build:
      context: ../../
      dockerfile: apps/collector/Dockerfile
    container_name: schurfer-orderflow-pilot
    entrypoint: ['/orderflow']
    environment:
      REDIS_ADDR: redis:6379
      BYBIT_SYMBOLS: ${ORDERFLOW_BYBIT_SYMBOLS:-}
      ORDERFLOW_BUCKET_SECONDS: ${ORDERFLOW_BUCKET_SECONDS:-1}
      ORDERFLOW_PREBUFFER_SECONDS: ${ORDERFLOW_PREBUFFER_SECONDS:-1800}
      ORDERFLOW_CAPTURE_AFTER_SECONDS: ${ORDERFLOW_CAPTURE_AFTER_SECONDS:-3600}
      ORDERFLOW_CONTROLS: ${ORDERFLOW_CONTROLS:-3}
      ORDERFLOW_MAX_SYMBOLS: ${ORDERFLOW_MAX_SYMBOLS:-1000}
      ORDERFLOW_MAX_ACTIVE_EVENTS: ${ORDERFLOW_MAX_ACTIVE_EVENTS:-32}
      ORDERFLOW_RECENT_TRADE_IDS: ${ORDERFLOW_RECENT_TRADE_IDS:-512}
      ORDERFLOW_QUEUE_SIZE: ${ORDERFLOW_QUEUE_SIZE:-32768}
      ORDERFLOW_MAX_PENDING_RECORDS: ${ORDERFLOW_MAX_PENDING_RECORDS:-8192}
      ORDERFLOW_STORAGE_ROOT: /data/orderflow
      ORDERFLOW_MAX_DISK_BYTES: ${ORDERFLOW_MAX_DISK_BYTES:-5368709120}
      ORDERFLOW_RETENTION_SECONDS: ${ORDERFLOW_RETENTION_SECONDS:-1209600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - orderflow_data:/data/orderflow
    depends_on:
      redis:
        condition: service_healthy
    restart: 'no'
    mem_limit: 384m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  momentum-capture:
    profiles: ['momentum-capture']
    build:
      context: ../../
      dockerfile: apps/collector/Dockerfile
    container_name: schurfer-momentum-capture
    entrypoint: ['/momentum-capture']
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://schurfer:${POSTGRES_PASSWORD}@postgres:5432/schurfer
      REDIS_ADDR: redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bounded canary, not a permanent core service (ROADMAP "Active course"
    # item 5): a human decides whether to keep running after the 48-72h
    # resource-and-data-quality canary, so this must not silently
    # restart-loop unattended. memswap_limit == mem_limit disables swap
    # growth for this container specifically (see the analytics service's
    # own comment on why: swap thrashing the whole host, not a clean OOM,
    # is the failure mode being guarded against). pids_limit is a bounded
    # backstop against a goroutine/fd-leak pathology; the process itself
    # only ever runs a handful of goroutines (one event loop, a handful of
    # trade-WS shards, NATS internals).
    restart: 'no'
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 512
    # cmd/momentumcapture's own shutdownTimeout is 75s (bounded by the
    # trade WS layer's own 60s read timeout, see internal/bybit/ws.go):
    # Docker's default 10s grace period would SIGKILL it mid-drain, well
    # before its own graceful shutdown sequence (stop producers, drain,
    # final flush) has a chance to finish. Keep these two in sync.
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  analytics:
    build:
      context: ../../
      dockerfile: apps/analytics/Dockerfile
    container_name: schurfer-analytics
    # This image also backs every ad-hoc `docker compose run --entrypoint <report>
    # analytics ...` report invocation (Makefile's prod-*-report targets), not just
    # the persistent scanner below. On 2026-07-30 an unbounded ad-hoc report
    # reached ~1GB RSS and was OOM-killed by the host; on 2026-08-04/05 the host (2
    # vCPU, 3.7GB) hit full resource exhaustion twice from ordinary ad-hoc
    # analytics load. `docker compose run` has no per-invocation --memory/--cpus
    # flag, so the limit has to live here, on the shared service definition.
    # memswap_limit == mem_limit disables swap growth for this container
    # specifically (the observed failure mode was swap thrashing the whole host,
    # not a clean OOM) — the host's own emergency swap file remains a crash
    # backstop, not extra capacity for this container to lean on. 1536m sits above
    # the live scanner's ~710MB baseline and the ~1GB a legitimate heavy replay
    # has already been observed to need, while still bounding a runaway report
    # well short of the host's own 3.7GB. Override per-deploy with
    # ANALYTICS_MEM_LIMIT/ANALYTICS_CPU_LIMIT if a specific report genuinely needs
    # more; do not raise the default without a fresh headroom check.
    mem_limit: ${ANALYTICS_MEM_LIMIT:-1536m}
    memswap_limit: ${ANALYTICS_MEM_LIMIT:-1536m}
    cpus: ${ANALYTICS_CPU_LIMIT:-1.0}
    environment:
      DATABASE_URL: postgresql://schurfer:${POSTGRES_PASSWORD}@postgres:5432/schurfer
      REDIS_ADDR: redis:6379
      PUMP_EXCHANGES: ${PUMP_EXCHANGES:-}
      PUMP_MEASUREMENT_MIN_PCT: ${PUMP_MEASUREMENT_MIN_PCT:-20}
      # Blank preserves the legacy PUMP_MIN_PCT fallback inside the application.
      PUMP_ENTRY_MIN_PCT: ${PUMP_ENTRY_MIN_PCT:-}
      PUMP_MIN_PCT: ${PUMP_MIN_PCT:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
      SOURCE_LEAD_CAPTURE_ENABLED: ${SOURCE_LEAD_CAPTURE_ENABLED:-true}
      SOURCE_LEAD_TARGET_EXCHANGES: ${SOURCE_LEAD_TARGET_EXCHANGES:-binance,bybit}
      SOURCE_LEAD_NOTIONAL_USD: ${SOURCE_LEAD_NOTIONAL_USD:-50}
      SOURCE_LEAD_TIMEOUT_SECONDS: ${SOURCE_LEAD_TIMEOUT_SECONDS:-5}
      SOURCE_LEAD_BATCH_SIZE: ${SOURCE_LEAD_BATCH_SIZE:-8}
      SOURCE_LEAD_QUEUE_SIZE: ${SOURCE_LEAD_QUEUE_SIZE:-16}
      SOURCE_LEAD_SHUTDOWN_TIMEOUT_SECONDS: ${SOURCE_LEAD_SHUTDOWN_TIMEOUT_SECONDS:-10}
      # Optional: raises gate-identity-candidate-tooling's CoinGecko rate limit
      # ceiling. Blank still works, just at the anonymous public tier's limit.
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    volumes:
      - orderflow_data:/data/orderflow:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  outcome-resolver:
    build:
      context: ../../
      dockerfile: apps/analytics/Dockerfile
    container_name: schurfer-outcome-resolver
    entrypoint: ['outcome-resolver']
    environment:
      DATABASE_URL: postgresql://schurfer:${POSTGRES_PASSWORD}@postgres:5432/schurfer
      PUMP_EXCHANGES: ${PUMP_EXCHANGES:-}
      OUTCOME_POLL_INTERVAL: ${OUTCOME_POLL_INTERVAL:-300}
      OUTCOME_RETRY_AFTER: ${OUTCOME_RETRY_AFTER:-900}
      OUTCOME_BATCH_SIZE: ${OUTCOME_BATCH_SIZE:-50}
      OUTCOME_MAX_ATTEMPTS: ${OUTCOME_MAX_ATTEMPTS:-8}
      DERIVATIVES_CONTEXT_ENABLED: ${DERIVATIVES_CONTEXT_ENABLED:-true}
      DERIVATIVES_CONTEXT_SINCE: ${DERIVATIVES_CONTEXT_SINCE:-2026-07-27T00:00:00Z}
      DERIVATIVES_CONTEXT_BEFORE_MINUTES: ${DERIVATIVES_CONTEXT_BEFORE_MINUTES:-240}
      DERIVATIVES_CONTEXT_AFTER_MINUTES: ${DERIVATIVES_CONTEXT_AFTER_MINUTES:-480}
      DERIVATIVES_CONTEXT_FETCH_LIMIT: ${DERIVATIVES_CONTEXT_FETCH_LIMIT:-200}
      DERIVATIVES_CONTEXT_MAX_PAGES: ${DERIVATIVES_CONTEXT_MAX_PAGES:-10}
      DERIVATIVES_CONTEXT_TIMEOUT: ${DERIVATIVES_CONTEXT_TIMEOUT:-15}
      DERIVATIVES_CONTEXT_RETRY_AFTER: ${DERIVATIVES_CONTEXT_RETRY_AFTER:-900}
      DERIVATIVES_CONTEXT_BATCH_SIZE: ${DERIVATIVES_CONTEXT_BATCH_SIZE:-8}
      DERIVATIVES_CONTEXT_MAX_ATTEMPTS: ${DERIVATIVES_CONTEXT_MAX_ATTEMPTS:-8}
      LONG_HORIZON_FUNDING_ENABLED: ${LONG_HORIZON_FUNDING_ENABLED:-true}
      LONG_HORIZON_FUNDING_SINCE: ${LONG_HORIZON_FUNDING_SINCE:-2026-07-22T00:00:00Z}
      LONG_HORIZON_FUNDING_BEFORE_MINUTES: ${LONG_HORIZON_FUNDING_BEFORE_MINUTES:-1440}
      LONG_HORIZON_FUNDING_AFTER_MINUTES: ${LONG_HORIZON_FUNDING_AFTER_MINUTES:-10080}
      LONG_HORIZON_FUNDING_FETCH_LIMIT: ${LONG_HORIZON_FUNDING_FETCH_LIMIT:-200}
      LONG_HORIZON_FUNDING_MAX_PAGES: ${LONG_HORIZON_FUNDING_MAX_PAGES:-10}
      LONG_HORIZON_FUNDING_TIMEOUT: ${LONG_HORIZON_FUNDING_TIMEOUT:-15}
      LONG_HORIZON_FUNDING_RETRY_AFTER: ${LONG_HORIZON_FUNDING_RETRY_AFTER:-900}
      LONG_HORIZON_FUNDING_BATCH_SIZE: ${LONG_HORIZON_FUNDING_BATCH_SIZE:-8}
      LONG_HORIZON_FUNDING_MAX_ATTEMPTS: ${LONG_HORIZON_FUNDING_MAX_ATTEMPTS:-8}
      OPEN_ENDED_MARGIN_FUNDING_ENABLED: ${OPEN_ENDED_MARGIN_FUNDING_ENABLED:-true}
      OPEN_ENDED_MARGIN_FUNDING_SINCE: ${OPEN_ENDED_MARGIN_FUNDING_SINCE:-2026-08-03T00:00:00Z}
      OPEN_ENDED_MARGIN_FUNDING_BEFORE_MINUTES: ${OPEN_ENDED_MARGIN_FUNDING_BEFORE_MINUTES:-1440}
      OPEN_ENDED_MARGIN_FUNDING_AFTER_MINUTES: ${OPEN_ENDED_MARGIN_FUNDING_AFTER_MINUTES:-40320}
      OPEN_ENDED_MARGIN_FUNDING_FETCH_LIMIT: ${OPEN_ENDED_MARGIN_FUNDING_FETCH_LIMIT:-200}
      OPEN_ENDED_MARGIN_FUNDING_MAX_PAGES: ${OPEN_ENDED_MARGIN_FUNDING_MAX_PAGES:-10}
      OPEN_ENDED_MARGIN_FUNDING_TIMEOUT: ${OPEN_ENDED_MARGIN_FUNDING_TIMEOUT:-15}
      OPEN_ENDED_MARGIN_FUNDING_RETRY_AFTER: ${OPEN_ENDED_MARGIN_FUNDING_RETRY_AFTER:-900}
      OPEN_ENDED_MARGIN_FUNDING_BATCH_SIZE: ${OPEN_ENDED_MARGIN_FUNDING_BATCH_SIZE:-4}
      OPEN_ENDED_MARGIN_FUNDING_MAX_ATTEMPTS: ${OPEN_ENDED_MARGIN_FUNDING_MAX_ATTEMPTS:-8}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  execution:
    build:
      context: ../../
      dockerfile: apps/execution/Dockerfile
    container_name: schurfer-execution
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgresql://schurfer:${POSTGRES_PASSWORD}@postgres:5432/schurfer
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_API_SECRET: ${OKX_API_SECRET:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      GATE_API_KEY: ${GATE_API_KEY:-}
      GATE_API_SECRET: ${GATE_API_SECRET:-}
      KUCOIN_API_KEY: ${KUCOIN_API_KEY:-}
      KUCOIN_API_SECRET: ${KUCOIN_API_SECRET:-}
      KUCOIN_PASSPHRASE: ${KUCOIN_PASSPHRASE:-}
      BINGX_API_KEY: ${BINGX_API_KEY:-}
      BINGX_API_SECRET: ${BINGX_API_SECRET:-}
      MEXC_API_KEY: ${MEXC_API_KEY:-}
      MEXC_API_SECRET: ${MEXC_API_SECRET:-}
      MAX_POSITIONS: ${MAX_POSITIONS:-5}
      MAX_POSITION_USD: ${MAX_POSITION_USD:-500}
      DAILY_LOSS_LIMIT_USD: ${DAILY_LOSS_LIMIT_USD:-200}
      LIQUIDATION_BUFFER_PCT: ${LIQUIDATION_BUFFER_PCT:-20}
      MIN_FUNDING_RATE_PCT: ${MIN_FUNDING_RATE_PCT:--0.1}
      REQUIRE_FUNDING_RATE: ${REQUIRE_FUNDING_RATE:-false}
      RISK_PER_TRADE_PCT: ${RISK_PER_TRADE_PCT:-0}
      REQUIRE_MARKET_QUALITY: ${REQUIRE_MARKET_QUALITY:-true}
      MAX_SPREAD_BPS: ${MAX_SPREAD_BPS:-50}
      MAX_LIQUIDITY_IMPACT_BPS: ${MAX_LIQUIDITY_IMPACT_BPS:-50}
      LIQUIDITY_DEPTH_MULTIPLIER: ${LIQUIDITY_DEPTH_MULTIPLIER:-2}
      REQUIRE_RED_CANDLE: ${REQUIRE_RED_CANDLE:-false}
      MIN_RETRACE_PCT: ${MIN_RETRACE_PCT:-0}
      AUTO_TRADE: ${AUTO_TRADE:-false}
      DRY_RUN: ${DRY_RUN:-false}
      SIGNAL_POSITION_USD: ${SIGNAL_POSITION_USD:-50}
      SIGNAL_LEVERAGE: ${SIGNAL_LEVERAGE:-3}
      STRATEGY_VERSION: ${STRATEGY_VERSION:-pump_short_v1_market_quality}
      MEASUREMENT_STRATEGY_VERSION: ${MEASUREMENT_STRATEGY_VERSION:-pump_short_measurement_v1}
      # Blank preserves the legacy PUMP_MIN_PCT fallback inside the application.
      PUMP_ENTRY_MIN_PCT: ${PUMP_ENTRY_MIN_PCT:-}
      PUMP_MIN_PCT: ${PUMP_MIN_PCT:-}
      SCORE_THRESHOLD: ${SCORE_THRESHOLD:-6}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  notifier:
    build:
      context: ../../
      dockerfile: apps/notifier/Dockerfile
    container_name: schurfer-notifier
    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgresql://schurfer:${POSTGRES_PASSWORD}@postgres:5432/schurfer
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-240}
      NOTIFY_MIN_PCT: ${NOTIFY_MIN_PCT:-60}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  redis_data:
  nats_data:
  caddy_data:
  caddy_config:
  orderflow_data:
