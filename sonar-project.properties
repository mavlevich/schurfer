sonar.projectKey=mavlevich_schurfer
sonar.organization=mavlevich
sonar.projectName=Schurfer

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*_test.py,**/test_*.py,**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/vendor/**,**/__pycache__/**,**/dist/**

# Python
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# Go
sonar.go.coverage.reportPaths=coverage.out

# TypeScript
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info

sonar.qualitygate.wait=true
